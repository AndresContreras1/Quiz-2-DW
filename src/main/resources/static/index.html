<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz 2 - Productos</title>

    <!-- Bootstrap primero, el CSS propio despues: si va al reves, el framework lo pisa. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0">Quiz 2 &middot; Spring Boot y JPA</span>
        </div>
    </nav>

    <main class="container my-4">

        <h1 class="h3 mb-4">Administracion de productos</h1>

        <div class="row g-4">

            <!-- Registrar: POST /productos -->
            <section class="col-12 col-lg-5">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-3">Registrar un producto</h2>

                        <form id="formulario-producto" novalidate>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                       placeholder="Nombre" maxlength="80" required>
                                <label for="nombre">Nombre</label>
                                <div class="invalid-feedback">Escribe el nombre del producto.</div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="categoria" name="categoria"
                                       placeholder="Categoria" maxlength="50" required>
                                <label for="categoria">Categoria</label>
                                <div class="invalid-feedback">Escribe la categoria.</div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="number" class="form-control" id="precio" name="precio"
                                       placeholder="Precio" min="0" step="0.01" required>
                                <label for="precio">Precio</label>
                                <div class="invalid-feedback">Escribe un precio valido.</div>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
                                <label class="form-check-label" for="activo">Producto activo</label>
                            </div>

                            <button type="submit" class="btn btn-dark w-100">Registrar</button>
                        </form>

                        <p id="mensaje-registro" class="mt-3 mb-0 small"></p>
                    </div>
                </div>
            </section>

            <!-- Buscar: GET /productos/buscar/{categoria} -->
            <section class="col-12 col-lg-7">
                <div class="card h-100">
                    <div class="card-body">
                        <h2 class="h5 card-title mb-3">Buscar por categoria</h2>

                        <form id="formulario-busqueda" class="row g-2 mb-3" novalidate>
                            <div class="col">
                                <input type="text" class="form-control" id="categoria-buscada"
                                       placeholder="Bebidas, Granos, Aseo..." required>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-outline-dark">Buscar</button>
                            </div>
                        </form>

                        <div class="table-responsive">
                            <table class="table table-striped align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col">Id</th>
                                        <th scope="col">Nombre</th>
                                        <th scope="col">Categoria</th>
                                        <th scope="col" class="text-end">Precio</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-tabla"></tbody>
                            </table>
                        </div>

                        <p id="mensaje-busqueda" class="mb-0 small text-secondary"></p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <script type="module" src="js/app.js"></script>
</body>

</html>
