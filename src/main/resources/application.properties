# --- conexion: H2 embebida, en el mismo proceso que Spring Boot ---
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./productosdb
spring.datasource.username=sa
spring.datasource.password=

# --- consola grafica en localhost:8080/h2 ---
# El JDBC URL del formulario tiene que ser exactamente el de arriba.
spring.h2.console.enabled=true
spring.h2.console.path=/h2

# --- esquema: se borra y se recrea en cada arranque ---
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

# --- ver el SQL que Hibernate genera a partir de la JPQL ---
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.format_sql=true
